name: TicketLab checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.js
      - run: node --check public/student-requests-fix.js
      - run: node --check src/core.js
      - run: node --check src/store.js
      - run: node --check src/change-templates.js
      - run: npm test
